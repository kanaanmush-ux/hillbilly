<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>K.M.Awareness | Login</title>
</head>
<body>
  <div class="body-container">
     <div class="logo-container">
    <img src = "km-logo-circular-badge.png" alt = "K.M.Awareness Logo" id = "logo">

   </div>
   <div class="header">
    <h1>Welcome to K.M.Awareness</h1>
    <p>Are you a coward or a hero?</p>
    <p>Login to find out!</p>
   </div>
   <div class="formArea">
<label for="email"></label>
<input type="text" id="email" name="email " required placeholder="Enter username or email">
<label for="password"></label>
<input type="password" id="password" name="password" required placeholder="Enter password">
   </div>
   <div class="suggestion">
<label for="remember-me">
    <input type="checkbox" id="remember-me" name="remember-me">
    Remember me</label>

 <label for="forgot-password"><a href="forgot-password.html">Forgot your password?</a></label>
   </div>
   <div class="SI-btn">
    <button  id="loginButton" >Sign In</button>
     
   </div>
   </div>
   


   </div>
  </div> 
  
</body>
<script src="login.js"></script>
</html>
