<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In</title><link rel="stylesheet" href="login.css"></head>
<body>
  <!-- This fixed-size canvas matches the supplied 402 × 874 design. -->
  <main class="sign-in" aria-labelledby="page-title">
    <img class="logo" src="km-logo-circular-badge.png" alt="K.M. Awareness logo">
    <section class="intro"><h1 id="page-title">Welcome Back</h1><p>Are you coward or a girl?</p></section>
    <!-- JavaScript provides the feedback for this teaching demo. -->
    <form id="login-form" novalidate>
      <label class="sr-only" for="email">Email address</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="1.5"></rect><path d="m3.5 5.5 8.5 7 8.5-7M3.5 18.5l6.4-6M20.5 18.5l-6.4-6"></path></svg>
        <input id="email" type="email" placeholder="Enter Email" autocomplete="email" required>
      </div>
      <label class="sr-only" for="password">Password</label>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path></svg>
        <input id="password" type="password" placeholder="Enter Password" autocomplete="current-password" required>
        <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false"><svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button>
      </div>
      <div class="options"><label class="remember"><input id="remember" type="checkbox"><span>Remember Me</span></label><a href="#forgot">Forgot Password?</a></div>
      <button class="submit" type="submit">Sign In</button>
    </form>
  </main><script src="login.js"></script>
</body></html>
